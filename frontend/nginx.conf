# Production web sunucusu (deploy/docker-compose.prod.yml → web). HTTPS ve dış erişim ayrı aşamadaki Caddy'dedir.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Backend 50 MB üstünü 413 ile reddeder (D-028); multipart ek yükü için küçük pay bırakılır.
    client_max_body_size 51m;

    # api adresi her istekte Docker DNS'inden çözülür; api container'ı yeniden oluşturulunca IP değişse de çalışır.
    # "dosya-api" backend ağındaki tekil alias'tır (deploy/docker-compose.prod.yml); genel "api" adı kullanılmaz.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://dosya-api:8000;

    # Yalnız /api/ yayınlanır: /docs, /openapi.json ve /health dışarı açılmaz.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Gövde diske tamponlanmadan backend'e akar; backend kendi 50 MB sınırını uygular.
        proxy_request_buffering off;
        # İstemci her isteği 120 sn sonra keser (D-039).
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
